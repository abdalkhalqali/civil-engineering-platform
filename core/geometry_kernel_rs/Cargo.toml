[package]
name = "geometry_kernel_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Bridge to Flutter (flutter_rust_bridge v2).
flutter_rust_bridge = "=2.13.0"

# Data-model dependencies of the M0 foundation. They are not used by the
# bridge proof of concept itself and are kept for the upcoming kernel work.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
